[package]
name = "securecompare-mpz-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true

[profile.wasm]
inherits = "release"
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
futures = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
mpz-circuits = { git = "https://github.com/privacy-ethereum/mpz.git", rev = "7a5d41c2358dbefaa76c3d07e41fd39ac74b2b09" }
mpz-common = { git = "https://github.com/privacy-ethereum/mpz.git", rev = "7a5d41c2358dbefaa76c3d07e41fd39ac74b2b09", features = ["test-utils"] }
mpz-core = { git = "https://github.com/privacy-ethereum/mpz.git", rev = "7a5d41c2358dbefaa76c3d07e41fd39ac74b2b09" }
mpz-garble = { git = "https://github.com/privacy-ethereum/mpz.git", rev = "7a5d41c2358dbefaa76c3d07e41fd39ac74b2b09" }
mpz-memory-core = { git = "https://github.com/privacy-ethereum/mpz.git", rev = "7a5d41c2358dbefaa76c3d07e41fd39ac74b2b09" }
mpz-ot = { git = "https://github.com/privacy-ethereum/mpz.git", rev = "7a5d41c2358dbefaa76c3d07e41fd39ac74b2b09" }
mpz-vm-core = { git = "https://github.com/privacy-ethereum/mpz.git", rev = "7a5d41c2358dbefaa76c3d07e41fd39ac74b2b09" }
rand = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
pollster = "0.4"
serio = "0.2"
