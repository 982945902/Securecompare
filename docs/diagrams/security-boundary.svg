<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Security boundary for Invite PK</title>
  <desc id="desc">Diagram showing browser private inputs, signaling metadata, and the only revealed output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="980" height="430" rx="28" fill="url(#bg)"/>
  <text x="490" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Invite PK Security Boundary</text>
  <text x="490" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#c7d2fe">Only the comparison result is intentionally revealed</text>

  <rect x="58" y="118" width="248" height="190" rx="22" fill="url(#safe)" filter="url(#shadow)"/>
  <text x="182" y="154" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Challenger Browser</text>
  <rect x="92" y="178" width="180" height="42" rx="12" fill="#ffffff" stroke="#bae6fd"/>
  <text x="182" y="204" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369a1">Private value A</text>
  <rect x="92" y="236" width="180" height="42" rx="12" fill="#ffffff" stroke="#bae6fd"/>
  <text x="182" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#334155">mpz garbler role</text>

  <rect x="674" y="118" width="248" height="190" rx="22" fill="url(#safe)" filter="url(#shadow)"/>
  <text x="798" y="154" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Accepter Browser</text>
  <rect x="708" y="178" width="180" height="42" rx="12" fill="#ffffff" stroke="#bae6fd"/>
  <text x="798" y="204" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369a1">Private value B</text>
  <rect x="708" y="236" width="180" height="42" rx="12" fill="#ffffff" stroke="#bae6fd"/>
  <text x="798" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#334155">mpz evaluator role</text>

  <rect x="365" y="132" width="250" height="82" rx="18" fill="#fef3c7" stroke="#f59e0b" filter="url(#shadow)"/>
  <text x="490" y="164" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#92400e">Signaling Server</text>
  <text x="490" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#92400e">room id, offer, answer, ICE</text>

  <line x1="306" y1="172" x2="365" y2="172" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="615" y1="172" x2="674" y2="172" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="306" y1="262" x2="674" y2="262" stroke="#38bdf8" stroke-width="5" stroke-dasharray="10 8"/>
  <text x="490" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#e0f2fe">WebRTC DataChannel: MPC messages only</text>

  <rect x="358" y="326" width="264" height="58" rx="18" fill="#dcfce7" stroke="#22c55e"/>
  <text x="490" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534">Revealed output</text>
  <text x="490" y="373" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#166534">Win / Lose / Draw</text>
</svg>
