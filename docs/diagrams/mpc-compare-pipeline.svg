<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">MPC comparison pipeline</title>
  <desc id="desc">Pipeline from private values to encoded integers, OT stack, garbled circuit, and final comparison result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6d28d9" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="980" height="430" rx="28" fill="url(#bg)"/>
  <text x="490" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="850" fill="#1e1b4b">MPC Compare Pipeline</text>
  <text x="490" y="74" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#475569">Raw values are transformed into protocol messages and only the ordering result is decoded</text>

  <g font-family="Inter, system-ui, sans-serif">
    <rect x="42" y="138" width="132" height="86" rx="18" fill="url(#step)" stroke="#c4b5fd" filter="url(#shadow)"/>
    <text x="108" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Private values</text>
    <text x="108" y="195" text-anchor="middle" font-size="12" fill="#64748b">A and B stay local</text>

    <line x1="174" y1="181" x2="226" y2="181" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="226" y="138" width="132" height="86" rx="18" fill="url(#step)" stroke="#c4b5fd" filter="url(#shadow)"/>
    <text x="292" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Encode u32</text>
    <text x="292" y="195" text-anchor="middle" font-size="12" fill="#64748b">small compare domain</text>

    <line x1="358" y1="181" x2="410" y2="181" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="410" y="118" width="160" height="126" rx="18" fill="#fff7ed" stroke="#fb923c" filter="url(#shadow)"/>
    <text x="490" y="148" text-anchor="middle" font-size="15" font-weight="850" fill="#9a3412">OT Stack</text>
    <text x="490" y="174" text-anchor="middle" font-size="12" fill="#9a3412">Chou-Orlandi base OT</text>
    <text x="490" y="197" text-anchor="middle" font-size="12" fill="#9a3412">KOS RCOT extension</text>
    <text x="490" y="220" text-anchor="middle" font-size="12" fill="#9a3412">DerandCOT</text>

    <line x1="570" y1="181" x2="622" y2="181" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="622" y="138" width="150" height="86" rx="18" fill="url(#step)" stroke="#c4b5fd" filter="url(#shadow)"/>
    <text x="697" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Garbled circuit</text>
    <text x="697" y="195" text-anchor="middle" font-size="12" fill="#64748b">compare A ? B</text>

    <line x1="772" y1="181" x2="824" y2="181" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="824" y="138" width="114" height="86" rx="18" fill="#dcfce7" stroke="#22c55e" filter="url(#shadow)"/>
    <text x="881" y="170" text-anchor="middle" font-size="15" font-weight="850" fill="#166534">Result</text>
    <text x="881" y="195" text-anchor="middle" font-size="12" fill="#166534">win / lose / draw</text>
  </g>

  <rect x="188" y="292" width="604" height="58" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="490" y="316" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#334155">Network payload</text>
  <text x="490" y="338" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">DataChannel carries opaque MPC bytes, not JSON containing raw numbers</text>
</svg>
