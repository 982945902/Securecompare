<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Invite PK protocol flow</title>
  <desc id="desc">Diagram of invite creation, signaling, WebRTC channel creation, and private comparison.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4f46e5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="980" height="470" rx="28" fill="#ffffff"/>
  <text x="490" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="850" fill="#1e1b4b">Invite PK Protocol</text>
  <text x="490" y="74" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#475569">Signaling establishes the peer channel; MPC runs directly between browsers</text>

  <rect x="52" y="116" width="240" height="255" rx="22" fill="url(#panel)" stroke="#c4b5fd" filter="url(#shadow)"/>
  <text x="172" y="152" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" fill="#3730a3">1. Challenger</text>
  <rect x="82" y="184" width="180" height="44" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="172" y="211" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#312e81">Create room token</text>
  <rect x="82" y="246" width="180" height="44" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="172" y="273" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#312e81">Open DataChannel</text>
  <rect x="82" y="308" width="180" height="44" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="172" y="335" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#312e81">Run garbler role</text>

  <rect x="370" y="116" width="240" height="255" rx="22" fill="#fffbeb" stroke="#fbbf24" filter="url(#shadow)"/>
  <text x="490" y="152" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" fill="#92400e">2. Signaling</text>
  <rect x="400" y="184" width="180" height="44" rx="12" fill="#ffffff" stroke="#fde68a"/>
  <text x="490" y="211" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#92400e">Join room</text>
  <rect x="400" y="246" width="180" height="44" rx="12" fill="#ffffff" stroke="#fde68a"/>
  <text x="490" y="273" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#92400e">Relay offer / answer</text>
  <rect x="400" y="308" width="180" height="44" rx="12" fill="#ffffff" stroke="#fde68a"/>
  <text x="490" y="335" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#92400e">Relay ICE candidates</text>

  <rect x="688" y="116" width="240" height="255" rx="22" fill="url(#panel)" stroke="#c4b5fd" filter="url(#shadow)"/>
  <text x="808" y="152" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" fill="#3730a3">3. Accepter</text>
  <rect x="718" y="184" width="180" height="44" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="808" y="211" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#312e81">Open invite link</text>
  <rect x="718" y="246" width="180" height="44" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="808" y="273" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#312e81">Connect DataChannel</text>
  <rect x="718" y="308" width="180" height="44" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="808" y="335" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#312e81">Run evaluator role</text>

  <line x1="292" y1="210" x2="370" y2="210" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="610" y1="210" x2="688" y2="210" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M172 390 C290 438 690 438 808 390" fill="none" stroke="#06b6d4" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="490" y="426" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0891b2">Peer-to-peer MPC messages over WebRTC</text>
</svg>
